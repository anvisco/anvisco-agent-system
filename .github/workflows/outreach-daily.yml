name: Outreach Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 6'

permissions:
  contents: read

jobs:
  lead-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      MAX_NEW_LEADS_PER_RUN: ${{ secrets.MAX_NEW_LEADS_PER_RUN }}
      MAX_PLACES_RESULTS_PER_LOCATION: ${{ secrets.MAX_PLACES_RESULTS_PER_LOCATION }}
      MAX_TOTAL_CANDIDATES: ${{ secrets.MAX_TOTAL_CANDIDATES }}
      MAX_DRAFTS_PER_RUN: ${{ secrets.MAX_DRAFTS_PER_RUN }}
      CREATE_GMAIL_DRAFTS: "true"
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_SEND_AS_EMAIL: brian@anvisco.com
      GMAIL_LABEL: Anvis/Leads
      SEND_MODE: auto_draft
      AUTO_SEND_FIRST_EMAILS: "false"
      REQUIRE_ADMIN_APPROVAL_FOR_SEND: "true"
      COUNTRY_SCOPE: Canada
      ACTIVE_PROVINCE: Ontario
      ACTIVE_CITY: Toronto
      ONE_CITY_PER_RUN: "true"
      CITY_DUPLICATE_RATE_LIMIT: "0.70"
      CITY_MIN_USABLE_EMAIL_RATE: "0.15"
      CITY_WEAK_BATCH_LIMIT: "3"
      CITY_TARGET_USABLE_LEADS: "300"
      MAX_DAILY_PLACES_REQUESTS: "1000"
      MAX_WEEKLY_PLACES_REQUESTS: "3000"
      MAX_MONTHLY_PLACES_REQUESTS: "10000"
      MAX_WEEKLY_RAW_PLACE_RESULTS: "1000"
      MAX_WEEKLY_PLACE_DETAILS_CALLS: "750"
      MAX_WEEKLY_UNIQUE_LEADS: "300"
      MAX_WEEKLY_GMAIL_DRAFTS: "75"
      DRY_RUN: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run lead scraper
        run: python agents/run_lead_scraper.py

      - name: Generate Email 1 drafts
        run: python agents/generate_drafts_from_notion.py
