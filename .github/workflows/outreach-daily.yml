name: Outreach Daily

on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lead-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      MAX_LEADS_PER_RUN: ${{ secrets.MAX_LEADS_PER_RUN }}
      CREATE_GMAIL_DRAFTS: ${{ secrets.CREATE_GMAIL_DRAFTS }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      DRY_RUN: ${{ secrets.DRY_RUN }}
      SEND_EMAILS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run lead scraper
        run: python agents/run_lead_scraper.py

      - name: Generate Email 1 drafts
        run: python agents/generate_drafts_from_notion.py --mode email1
