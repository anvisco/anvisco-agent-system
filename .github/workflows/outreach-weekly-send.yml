name: Weekly Outreach Send

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the Monday send workflow as a dry run
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # Monday 12:00 UTC = 8:00 AM ET during daylight time.
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  send-approved-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      CANADA_CITY_QUEUE_DATABASE_ID: ${{ secrets.CANADA_CITY_QUEUE_DATABASE_ID }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_SEND_AS_EMAIL: brian@anvisco.com
      GMAIL_LABEL: Anvis/Leads
      SEND_APPROVED_DRAFTS: "true"
      SEND_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
      OPS_STATUS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
      ALLOW_RULE_BASED_APPROVAL: "true"
      ALLOW_LEGACY_STATUS_FALLBACK: "false"
      REQUIRE_ADMIN_APPROVAL_FOR_SEND: "true"
      MAX_SENDS_PER_RUN: "unlimited"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Update outreach Ops Status
        run: python agents/update_outreach_ops_status.py

      - name: Send approved Gmail drafts
        run: python agents/send_approved_gmail_drafts.py

      - name: Update outreach Ops Status after send
        run: python agents/update_outreach_ops_status.py

      - name: Check Gmail replies
        run: python agents/check_gmail_replies.py

      - name: Outreach health check
        run: python agents/outreach_health_check.py
